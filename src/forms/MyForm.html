<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div id="calculator">
        <input type="number" id="num1" placeholder="Number 1"></input>
        <input type="number" id="num2" placeholder="Number 2"></input>
        <button id="add-btn">+</button>
        <button id="subtract-btn">-</button>
        <button id="multiply-btn">*</button>
        <button id="divide-btn">/</button>
        <span id="result"></span>
    </div>

    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>

    <script>
        // Hooks for state management
        const [num1, setNum1] = React.useState(0);
        const [num2, setNum2] = React.useState(0);
        const [result, setResult] = React.useState(0);

        // Function to handle the addition operation
        function handleAddition() {
            const sum = parseInt(num1) + parseInt(num2);
            setResult(sum);
        }

        // Function to handle the subtraction operation
        function handleSubtraction() {
            const difference = parseInt(num1) - parseInt(num2);
            setResult(difference);
        }

        // Function to handle the multiplication operation
        function handleMultiplication() {
            const product = parseInt(num1) * parseInt(num2);
            setResult(product);
        }

        // Function to handle the division operation
        function handleDivision() {
            const quotient = parseInt(num1) / parseInt(num2);
            setResult(quotient);
        }

        // Render the component
        ReactDOM.render(
            <div>
                <h1>Calculator</h1>
                <form onSubmit={handleSubmit}>
                    <label htmlFor="num1">Number 1: </label>
                    <input type="number" id="num1" value={num1} onChange={(e) => setNum1(e.target.value)} />
                    <br />
                    <label htmlFor="num2">Number 2: </label>
                    <input type="number" id="num2" value={num2} onChange={(e) => setNum2(e.target.value)} />
                    <br />
                    <button type="submit">+</button>
                    <button type="submit">-</button>
                    <button type="submit">*</button>
                    <button type="submit">/</button>
                    <span id="result">{result}</span>
                </form>
            </div>,
            document.getElementById('calculator')
        );
    </script>
</body>
</html>
